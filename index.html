<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خربشة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: sticker-style game UI. Home = logo + live doodle demo beside the join card; game = players | board | chat. */
:root{
  --bg:#EDEFFF; --surface:#FFFFFF; --surface2:#F3F4FF; --ink:#1A1D4A; --muted:#5E6399; --line:#D5D9F7; --edge:#1A1D4A;
  --coral:#FF4F73; --sun:#FFC22E; --teal:#10B59D; --blue:#4157FF; --paper:#FFFFFF; --on-accent:#1A1D4A;
  --f-display:'Lalezar','Tajawal',system-ui,sans-serif; --f-body:'Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1131; --surface:#1B1E50; --surface2:#262A64; --ink:#F1F2FF; --muted:#A5AADC; --line:#343A84; --edge:#02030F;
    --coral:#FF6B8A; --teal:#22D2B9; --blue:#7C8BFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1131; --surface:#1B1E50; --surface2:#262A64; --ink:#F1F2FF; --muted:#A5AADC; --line:#343A84; --edge:#02030F;
  --coral:#FF6B8A; --teal:#22D2B9; --blue:#7C8BFF; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{
  margin:0; min-height:100vh; font:500 16px/1.5 var(--f-body); color:var(--ink); background:var(--bg);
  background-image:radial-gradient(var(--line) 1.6px,transparent 1.7px); background-size:26px 26px;
  padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue); outline-offset:3px}
#app{max-width:1180px; margin:0 auto}

/* top bar */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; margin-bottom:14px}
.logo-sm{font:400 2rem/1 var(--f-display); color:var(--sun); background:none; border:0; padding:0; cursor:pointer;
  -webkit-text-stroke:8px var(--edge); paint-order:stroke fill; text-shadow:3px 4px 0 var(--edge)}

/* shared pieces */
.card{background:var(--surface); border:3px solid var(--edge); border-radius:22px; box-shadow:5px 5px 0 var(--edge); padding:20px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font:400 1.25rem/1 var(--f-display);
  padding:14px 20px; border:3px solid var(--edge); border-radius:16px; background:var(--sun); color:var(--on-accent);
  box-shadow:0 5px 0 var(--edge); cursor:pointer; transition:transform .09s, box-shadow .09s, filter .15s}
.btn:hover{transform:translateY(-2px); box-shadow:0 7px 0 var(--edge); filter:brightness(1.05)}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none; box-shadow:0 3px 0 var(--edge); filter:none}
.btn.coral{background:var(--coral)} .btn.teal{background:var(--teal)} .btn.ghost{background:var(--surface); color:var(--ink)}
.btn.sm{font-size:1rem; padding:10px 14px; border-radius:12px}
.btn.block{width:100%}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-weight:800; font-size:.95rem}
.inp{width:100%; font:700 1.15rem/1.2 var(--f-body); padding:13px 14px; border:3px solid var(--edge); border-radius:14px; background:var(--surface2); color:var(--ink)}
.inp::placeholder{color:var(--muted); font-weight:500}
.inp.shake{animation:shake .4s}
.chip{font:700 1rem/1 var(--f-body); padding:10px 14px; border:3px solid var(--edge); border-radius:12px; background:var(--surface); color:var(--ink); cursor:pointer; transition:transform .1s}
.chip[aria-pressed="true"]{background:var(--sun); color:var(--on-accent); transform:translateY(-2px); box-shadow:0 3px 0 var(--edge)}
.av{width:100%; height:100%; display:block}
.screen{animation:pop .35s cubic-bezier(.3,1.4,.5,1) both}
h2{font:400 1.9rem/1.2 var(--f-display); margin:0; text-wrap:balance}
.muted{color:var(--muted)}

/* home */
.home{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); grid-template-areas:"hero join" "demo join"; gap:28px 36px; align-items:start; max-width:1080px; margin:0 auto}
.hero{grid-area:hero; padding-top:8px}
.logo{display:inline-block; margin:0; font:400 clamp(4.5rem,13vw,8rem)/1.05 var(--f-display); color:var(--sun);
  -webkit-text-stroke:14px var(--edge); paint-order:stroke fill; text-shadow:7px 9px 0 var(--edge); animation:drop .9s cubic-bezier(.3,1.6,.5,1) both}
.squig{display:block; width:min(300px,70%); height:26px; margin-top:6px}
.squig path{fill:none; stroke:var(--coral); stroke-width:9; stroke-linecap:round; stroke-dasharray:420; stroke-dashoffset:420; animation:draw 1.1s .5s ease-out forwards}
.tag{font-size:1.25rem; font-weight:700; max-width:30ch; margin:14px 0 0}
.demo{grid-area:demo; padding:12px; transform:rotate(-1.2deg)}
.demo-bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.who{display:flex; align-items:center; gap:8px; font-weight:800}
.who .av-s{width:34px; height:34px}
.join{grid-area:join; display:flex; flex-direction:column; gap:16px; padding:24px}
.me-row{display:flex; gap:14px; align-items:flex-end}
.me-av{width:84px; height:84px; flex:none; border:0; background:none; padding:0; cursor:pointer; transition:transform .25s}
.me-av:hover{transform:rotate(-8deg) scale(1.06)}
.me-av.spin{animation:spin .5s}
.sep{display:flex; align-items:center; gap:10px; color:var(--muted); font-weight:700}
.sep::before,.sep::after{content:""; flex:1; height:3px; border-radius:2px; background:var(--line)}
.code-row{display:flex; gap:10px}
.code-row .inp{text-align:center; letter-spacing:.3em; text-transform:uppercase; direction:ltr; font-family:var(--f-display); font-size:1.4rem}
.note{font-size:.88rem; color:var(--muted); margin:0}

/* letters hint */
.hint{display:flex; flex-wrap:wrap; justify-content:center; gap:2px; min-height:2.7rem}
.lt{display:inline-block; width:2rem; height:2.7rem; margin:0 3px; text-align:center; font:400 1.9rem/2.5rem var(--f-display); border-bottom:4px solid var(--edge)}
.lt.on{animation:flip .4s both}
.hint.small .lt{width:1.5rem; height:2rem; font-size:1.4rem; line-height:1.9rem; border-bottom-width:3px}

/* find + lobby */
.center{max-width:720px; margin:30px auto 0; text-align:center; display:flex; flex-direction:column; gap:22px; align-items:center}
.slots{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; width:100%}
.slot{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
.slot .face{width:72px; height:72px; position:relative}
.slot .face.in{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.slot .face.empty{border:3px dashed var(--muted); border-radius:50%; display:grid; place-items:center; color:var(--muted); font:400 1.6rem var(--f-display); animation:pulse 1.4s infinite}
.slot b{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800}
.crown{position:absolute; top:-16px; inset-inline-start:50%; width:30px; transform:translateX(50%) rotate(-10deg)}
.codebox{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center}
.code{font:400 3.4rem/1 var(--f-display); letter-spacing:.18em; direction:ltr; padding:10px 22px 4px; border:3px dashed var(--edge); border-radius:16px; background:var(--surface2)}
.lobby{max-width:760px; margin:10px auto 0; display:flex; flex-direction:column; gap:20px}
.setrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.setrow>span{font-weight:800; min-width:90px}

/* game */
.game{display:grid; grid-template-columns:230px minmax(0,1fr) 290px; grid-template-areas:"pl bd ch"; gap:16px; align-items:start}
.plist{grid-area:pl; display:flex; flex-direction:column; gap:8px; padding:12px}
.pl{display:flex; align-items:center; gap:8px; padding:8px; border:3px solid transparent; border-radius:14px; min-width:0; transition:background .3s}
.pl .rk{font:400 1rem var(--f-display); width:1.2rem; color:var(--muted); text-align:center}
.pl .a{width:38px; height:38px; flex:none}
.pn{display:flex; flex-direction:column; min-width:0; flex:1; line-height:1.2}
.pn b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pn small{font-size:.78rem; color:var(--muted); font-weight:700; min-height:1em}
.sc{font:400 1.3rem var(--f-display); font-variant-numeric:tabular-nums}
.sc.bump{animation:bump .6s}
.pl.draw{background:color-mix(in srgb,var(--sun) 35%,var(--surface)); border-color:var(--edge)}
.pl.got{background:color-mix(in srgb,var(--teal) 25%,var(--surface))}
.stage{grid-area:bd; display:flex; flex-direction:column; gap:12px; min-width:0}
.bar{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; padding:10px 14px}
.turn{font:400 1rem var(--f-display); background:var(--sun); color:var(--on-accent); border:3px solid var(--edge); border-radius:12px; padding:8px 12px; white-space:nowrap}
.hintbox{text-align:center; min-width:0}
.hintbox small{display:block; color:var(--muted); font-weight:700; font-size:.82rem}
.ringw{position:relative; width:64px; height:64px}
.ringw svg{width:64px; height:64px; transform:rotate(-90deg)}
.ringw circle{fill:none; stroke-width:8}
.ringw .bg{stroke:var(--line)}
.ringw .fg{stroke:var(--teal); stroke-linecap:round; stroke-dasharray:163.4; transition:stroke-dashoffset .12s linear, stroke .3s}
.ringw.low .fg{stroke:var(--coral)}
.ringw b{position:absolute; inset:0; display:grid; place-items:center; font:400 1.35rem var(--f-display); font-variant-numeric:tabular-nums}
.ringw.low b{animation:pulse .5s infinite}
.board{position:relative; border:3px solid var(--edge); border-radius:20px; overflow:hidden; background:var(--paper); box-shadow:5px 5px 0 var(--edge); aspect-ratio:4/3; width:100%}
.board canvas{display:block; width:100%; height:100%; touch-action:none; cursor:crosshair}
.ov{position:absolute; inset:0; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; text-align:center; padding:16px;
  background:color-mix(in srgb,var(--surface) 92%,transparent); color:var(--ink); animation:fade .25s both}
.ov .big{font:400 clamp(2.4rem,7vw,4.2rem)/1.1 var(--f-display); animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.choices{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.deltas{display:flex; gap:8px 14px; flex-wrap:wrap; justify-content:center; max-width:90%}
.deltas span{display:inline-flex; gap:6px; align-items:center; font-weight:800}
.deltas i{font-style:normal; color:var(--teal); font-family:var(--f-display); font-size:1.2rem; animation:pop .5s both}
.tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 12px}
.sw{width:30px; height:30px; border-radius:50%; border:3px solid var(--edge); cursor:pointer; padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--blue); outline-offset:2px; transform:scale(1.1)}
.tl{width:1px; align-self:stretch; background:var(--line); margin:0 4px}
.sz{width:38px; height:38px; display:grid; place-items:center; border:3px solid var(--edge); border-radius:12px; background:var(--surface); cursor:pointer; padding:0}
.sz[aria-pressed="true"]{background:var(--sun)}
.sz i{display:block; border-radius:50%; background:var(--edge)}
.spectate{display:flex; align-items:center; gap:10px; padding:10px 14px; font-weight:800}
.chatc{grid-area:ch; display:flex; flex-direction:column; padding:12px; gap:10px; height:min(560px,70vh)}
.chat{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-inline-end:4px; min-height:0}
.msg{padding:7px 10px; border-radius:12px; background:var(--surface2); font-size:.95rem; overflow-wrap:anywhere; animation:slide .25s both}
.msg b{font-weight:800}
.msg.ok{background:color-mix(in srgb,var(--teal) 28%,var(--surface)); font-weight:700}
.msg.sys{background:none; color:var(--muted); font-weight:700; font-size:.88rem; padding:2px 4px}
.msg.near{background:color-mix(in srgb,var(--sun) 40%,var(--surface)); font-weight:700}
.gform{display:flex; gap:8px}
.gform .inp{padding:11px 12px}

.micbar{display:flex; gap:8px}
.micbar .btn{flex:1; font-size:.95rem; padding:9px 8px}
.micbar .btn[aria-pressed="true"]{background:var(--teal)}
.pl .a{position:relative}
.pl .a.speak::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:3px solid var(--teal); animation:ring .9s infinite}
.mi{width:18px; height:18px; flex:none; color:var(--muted)}
@keyframes ring{from{transform:scale(.92); opacity:1} to{transform:scale(1.3); opacity:0}}
/* final */
.final{max-width:760px; margin:10px auto 0; text-align:center; display:flex; flex-direction:column; gap:20px; align-items:center; position:relative}
.podium{display:flex; align-items:flex-end; justify-content:center; gap:12px; width:100%; min-height:300px}
.pcol{flex:1; max-width:190px; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
.pcol .face{width:70px; height:70px; position:relative; animation:drop .7s cubic-bezier(.3,1.6,.5,1) both}
.pcol b{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.step{width:100%; border:3px solid var(--edge); border-bottom:0; border-radius:16px 16px 0 0; display:flex; flex-direction:column; align-items:center; padding-top:10px; transform-origin:bottom; animation:grow .7s cubic-bezier(.3,1.3,.5,1) both}
.step span{font:400 2.4rem/1 var(--f-display)}
.step small{font:800 .95rem var(--f-body)}
.rest{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.rest span{display:inline-flex; gap:6px; align-items:center; background:var(--surface); border:3px solid var(--edge); border-radius:12px; padding:4px 10px; font-weight:800}
.rest .av-s{width:26px; height:26px}
.confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.confetti i{position:absolute; top:-14px; width:10px; height:16px; border-radius:2px; animation:fall linear forwards}

/* overlays */
.cd{position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:color-mix(in srgb,var(--bg) 88%,transparent); animation:fade .2s both}
.cd b{font:400 clamp(8rem,34vw,16rem)/1 var(--f-display); color:var(--coral); -webkit-text-stroke:16px var(--edge); paint-order:stroke fill; text-shadow:8px 10px 0 var(--edge); animation:pop .6s cubic-bezier(.3,1.7,.5,1)}
.toast{position:fixed; z-index:70; inset-inline:0; margin-inline:auto; width:max-content; max-width:calc(100% - 32px); bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--ink); color:var(--bg); font-weight:800; padding:12px 18px; border-radius:14px; border:3px solid var(--edge); animation:slide .25s both}

@keyframes pop{from{opacity:0; transform:scale(.88) translateY(10px)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0} to{opacity:1}}
@keyframes slide{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@keyframes drop{0%{opacity:0; transform:translateY(-60px) rotate(-6deg)} 100%{opacity:1; transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{25%{transform:translateX(7px)} 50%{transform:translateX(-7px)} 75%{transform:translateX(4px)}}
@keyframes spin{to{transform:rotate(360deg) scale(1.08)}}
@keyframes pulse{50%{transform:scale(1.1); opacity:.7}}
@keyframes flip{from{transform:rotateX(90deg); opacity:0} to{transform:none; opacity:1}}
@keyframes bump{40%{transform:scale(1.5); color:var(--teal)}}
@keyframes grow{from{transform:scaleY(0)} to{transform:none}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

@media (max-width:960px){
  .home{grid-template-columns:minmax(0,1fr); grid-template-areas:"hero" "join" "demo"}
  .game{grid-template-columns:minmax(0,1fr); grid-template-areas:"bd" "pl" "ch"}
  .plist{flex-direction:row; overflow-x:auto; padding:10px}
  .pl{min-width:190px}
  .pn small{white-space:nowrap}
  .chatc{height:320px}
  .demo{transform:none}
}
@media (max-width:560px){
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"hint ring" "turn turn"}
  .bar .turn{grid-area:turn; justify-self:start}
  .hintbox{grid-area:hint} .ringw{grid-area:ring}
  .lt{width:1.6rem; height:2.3rem; font-size:1.5rem; line-height:2.1rem; margin:0 2px}
  .code{font-size:2.6rem}
  .step span{font-size:1.8rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important; animation-delay:0s!important; transition-duration:.001ms!important}
}

/* ---------- صوت ---------- */
.top .tools-r{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.btn[aria-pressed="true"].live{background:var(--teal)}
.btn.off{background:var(--coral)}
.face.speak::after,.pl .a.speak::after{content:""; position:absolute; inset:-5px; border-radius:50%; border:3px solid var(--teal); animation:ring .9s infinite}
.pl .a{position:relative}
.mi{width:18px; height:18px; flex:none; color:var(--teal)}
.mi.m{color:var(--coral)}
.slot .vi{position:absolute; bottom:-4px; inset-inline-end:-4px; width:24px; height:24px; background:var(--surface); border:2px solid var(--edge); border-radius:50%; display:grid; place-items:center}
.slot .vi .mi{width:14px; height:14px}
.autonote{font:400 1.3rem var(--f-display)}
@keyframes ring{from{transform:scale(.92); opacity:1} to{transform:scale(1.3); opacity:0}}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="logo-sm" id="homeBtn" type="button" aria-label="الصفحة الرئيسية">خربشة</button>
    <div class="tools-r" id="roomTools" hidden>
      <button class="btn ghost sm" id="voiceBtn" type="button" aria-pressed="false">انضم للصوت</button>
      <button class="btn ghost sm" id="micBtn" type="button" hidden>المايك شغال</button>
      <button class="btn ghost sm" id="deafBtn" type="button" hidden>السماعة شغالة</button>
      <button class="btn ghost sm" id="leave" type="button">خروج</button>
    </div>
  </header>

  <!-- الرئيسية -->
  <section class="screen home" id="s-home">
    <div class="hero">
      <h1 class="logo">خربشة</h1>
      <svg class="squig" viewBox="0 0 300 26" aria-hidden="true"><path d="M6 14 Q 30 -2 54 14 T 102 14 T 150 14 T 198 14 T 246 14 T 294 14"/></svg>
      <p class="tag">ارسم الكلمة، خمّن رسمة صحابك، واحكوا مع بعض بالمايك. كل واحد بيدخل باسمه بس.</p>
    </div>
    <div class="card demo" aria-label="مثال على رسم مباشر">
      <div class="demo-bar">
        <div class="who"><span class="av-s" id="demoAv"></span><span id="demoWho"></span></div>
        <div class="hint small" id="demoHint"></div>
      </div>
      <div class="board" style="box-shadow:none;border-radius:14px"><canvas id="demoCv"></canvas></div>
    </div>
    <form class="card join" id="joinForm" autocomplete="off">
      <div class="me-row">
        <button class="me-av" id="shuffle" type="button" aria-label="غيّر شكلك"></button>
        <div class="field" style="flex:1; min-width:0">
          <label for="name">اسمك</label>
          <input class="inp" id="name" maxlength="14" placeholder="مثلاً: أبو فارس">
        </div>
      </div>
      <button class="btn coral block" id="btnRandom" type="submit">العب مع ناس عشوائيين</button>
      <button class="btn block" id="btnCreate" type="button">أنشئ غرفة لأصحابك</button>
      <div class="sep">أو انضم بكود</div>
      <div class="code-row">
        <input class="inp" id="code" maxlength="4" placeholder="A1B2" aria-label="كود الغرفة">
        <button class="btn teal" id="btnJoin" type="button">انضم</button>
      </div>
      <p class="note" id="dbStatus"></p>
      <p class="note">الإصدار 2 (Firebase)</p>
    </form>
  </section>

  <!-- الغرفة -->
  <section class="screen lobby" id="s-lobby" hidden>
    <div class="card" style="display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center">
      <h2 id="lobbyTitle">غرفتك جاهزة</h2>
      <div class="codebox" id="codeBox"><div class="code" id="roomCode">----</div><button class="btn sm" id="copyCode" type="button">انسخ الكود</button></div>
      <p class="note" id="lobbySub"></p>
    </div>
    <div class="card"><div class="slots" id="lobbySlots"></div></div>
    <div class="card" id="hostTools" style="display:flex; flex-direction:column; gap:14px">

<script>
window.addEventListener("error",function(e){var t=document.getElementById("toast");if(t){t.textContent="خطأ بالصفحة: "+(e.message||"");t.hidden=false}});

/* =====================================================================
   الهَب: منطق الغرفة (كان سيرفر Node، صار يشتغل جوّا متصفح منشئ الغرفة)
   ===================================================================== */
function createHub(opts){
/* ---------- كلمات ---------- */
const WORDS = [
  'شمس','قمر','نجمة','بيت','شجرة','قلب','سمكة','تفاحة','قطة','كتاب','سيارة','طائرة','ساعة','كرسي','دراجة',
  'موزة','مظلة','جبل','هاتف','باب','نافذة','مفتاح','قلم','حقيبة','نظارة','كلب','أسد','فيل','زرافة','حصان',
  'عصفور','فراشة','وردة','هلال','سحابة','مطر','ثلج','بحر','جزيرة','قارب','قطار','حافلة','صاروخ','كوكب',
  'بيتزا','برغر','كعكة','بطيخ','عنب','جزرة','قهوة','شاي','خبز','جبنة','بيضة','موز','برتقالة','فراولة',
  'كمبيوتر','تلفزيون','كاميرا','مصباح','شمعة','هدية','تاج','سيف','درع','خيمة','نار','خريطة','بوصلة','ميزان','جرس'
];

/* ---------- نصوص ---------- */
const norm = s => s.replace(/[ً-ْـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, '').toLowerCase();
const core = s => norm(s).replace(/^ال/, '');
function lev(a, b) {
  const m = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return m[a.length][b.length];
}
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clampN = (v, lo, hi, d) => (Number.isFinite(+v) ? Math.min(hi, Math.max(lo, +v)) : d);

/* ---------- غرف ---------- */
const rooms = new Map();
const MAX_PLAYERS = 8;

const clients = new Map();
const io = { to(x){ return { emit(ev, d){
  if (x === hubRoom.code) hubRoom.players.forEach((_, id) => { const c = clients.get(id); c && c.send(ev, d); });
  else { const c = clients.get(x); c && c.send(ev, d); }
}}}};
function mkSock(id, send){
  const s = { id, data: { room: null }, handlers: {}, send,
    emit(ev, d){ send(ev, d); },
    on(ev, fn){ s.handlers[ev] = fn; },
    join(){}, leave(){},
    to(){ return { emit(ev, d){ hubRoom.players.forEach((_, pid) => { if (pid !== id) { const c = clients.get(pid); c && c.send(ev, d); } }); } }; } };
  return s;
}
function makeCode() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  for (;;) {
    const c = Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join('');
    if (!rooms.has(c)) return c;
  }
}
function newRoom(isPublic) {
  const r = {
    code: makeCode(), public: isPublic, hostId: null, state: 'lobby', cfg: { rounds: 1, time: 45 },
    players: new Map(), order: [], turn: 0, turns: 0, drawerId: null, phase: 'idle', word: null, choices: [],
    guessed: new Set(), delta: {}, strokes: [], revealed: new Set(), endAt: 0,
    timer: null, hintTimers: [], autoTimer: null, autoLeft: 0, starting: null, noAutoUntil: 0
  };
  rooms.set(r.code, r);
  return r;
}
const pub = r => ({
  code: r.code, public: r.public, hostId: r.hostId, state: r.state, cfg: r.cfg,
  players: [...r.players.values()].map(p => ({ id: p.id, name: p.name, a: p.a, score: p.score, voice: p.voice, muted: p.muted }))
});
const emitRoom = r => { io.to(r.code).emit('room', pub(r)); if (opts.onChange) opts.onChange(); };
const scoresOf = r => Object.fromEntries([...r.players.values()].map(p => [p.id, p.score]));
const roomOf = socket => rooms.get(socket.data.room);

/* ---------- بدء تلقائي للغرف العامة ---------- */
function syncAuto(r) {
  if (!r.public || r.state !== 'lobby' || r.starting) return;
  const n = r.players.size;
  if (n < 2 || Date.now() < r.noAutoUntil) {
    if (r.autoTimer) { clearInterval(r.autoTimer); r.autoTimer = null; }
    io.to(r.code).emit('auto', { secs: null });
    return;
  }
  if (n >= 6) r.autoLeft = Math.min(r.autoLeft || 3, 3);
  if (r.autoTimer) return;
  r.autoLeft = 10;
  io.to(r.code).emit('auto', { secs: r.autoLeft });
  r.autoTimer = setInterval(() => {
    r.autoLeft--;
    io.to(r.code).emit('auto', { secs: r.autoLeft });
    if (r.autoLeft <= 0) { clearInterval(r.autoTimer); r.autoTimer = null; beginCountdown(r); }
  }, 1000);
}

/* ---------- بدء اللعبة ---------- */
function beginCountdown(r) {
  if (r.state !== 'lobby' || r.starting || r.players.size < 2) return;
  if (r.autoTimer) { clearInterval(r.autoTimer); r.autoTimer = null; }
  let n = 3;
  const tick = () => {
    if (r.players.size < 2) { r.starting = null; io.to(r.code).emit('cd', { n: 0 }); syncAuto(r); return; }
    if (n === 0) { r.starting = null; startGame(r); return; }
    io.to(r.code).emit('cd', { n });
    n--;
    r.starting = setTimeout(tick, 1000);
  };
  r.starting = setTimeout(() => {}, 0);
  tick();
}
function startGame(r) {
  r.state = 'game';
  r.players.forEach(p => { p.score = 0; });
  r.order = shuffle([...r.players.keys()]);
  r.turn = 0;
  r.turns = r.order.length * r.cfg.rounds;
  io.to(r.code).emit('cd', { n: 0 });
  io.to(r.code).emit('game:start', { time: r.cfg.time, turns: r.turns });
  emitRoom(r);
  setTimeout(() => nextTurn(r), 600);
}
function clearTurnTimers(r) {
  clearTimeout(r.timer); r.timer = null;
  r.hintTimers.forEach(clearTimeout); r.hintTimers = [];
}
function nextTurn(r) {
  if (r.state !== 'game') return;
  if (r.turn >= r.turns) return endGame(r);
  r.order = r.order.filter(id => r.players.has(id));
  if (r.players.size < 2 || !r.order.length) return endGame(r);
  r.drawerId = r.order[r.turn % r.order.length];
  r.guessed = new Set(); r.delta = {}; r.strokes = []; r.revealed = new Set(); r.word = null;
  r.phase = 'choose';
  r.choices = shuffle(WORDS).slice(0, 3);
  io.to(r.code).emit('turn:choose', { drawerId: r.drawerId, turn: r.turn + 1, turns: r.turns });
  io.to(r.drawerId).emit('turn:words', { words: r.choices });
  clearTurnTimers(r);
  r.timer = setTimeout(() => beginPlay(r, r.choices[0]), 15000);
}
function beginPlay(r, word) {
  if (r.phase !== 'choose') return;
  clearTurnTimers(r);
  r.phase = 'play'; r.word = word;
  const total = r.cfg.time * 1000;
  r.endAt = Date.now() + total;
  const chars = [...word];
  io.to(r.code).emit('turn:begin', { drawerId: r.drawerId, len: chars.length, ms: total });
  io.to(r.drawerId).emit('turn:word', { word });
  const reveal = () => {
    const hidden = chars.map((_, i) => i).filter(i => !r.revealed.has(i));
    if (hidden.length > 2) {
      const i = hidden[Math.floor(Math.random() * hidden.length)];
      r.revealed.add(i);
      io.to(r.code).emit('hint', { idx: i, ch: chars[i] });
    }
  };
  if (chars.length >= 3) r.hintTimers = [setTimeout(reveal, total * 0.5), setTimeout(reveal, total * 0.75)];
  r.timer = setTimeout(() => endTurn(r), total);
}
function endTurn(r) {
  if (r.phase !== 'play' && r.phase !== 'choose') return;
  clearTurnTimers(r);
  r.phase = 'reveal';
  io.to(r.code).emit('turn:end', { word: r.word || r.choices[0], delta: r.delta, scores: scoresOf(r) });
  r.timer = setTimeout(() => { r.turn++; nextTurn(r); }, 4200);
}
function endGame(r) {
  clearTurnTimers(r);
  const ranking = [...r.players.values()].sort((a, b) => b.score - a.score).map(p => ({ id: p.id, name: p.name, a: p.a, score: p.score }));
  r.state = 'lobby'; r.phase = 'idle'; r.drawerId = null; r.noAutoUntil = Date.now() + 20000;
  io.to(r.code).emit('game:end', { ranking });
  r.players.forEach(p => { p.score = 0; });
  emitRoom(r);
}

/* ---------- مغادرة ---------- */
function removePlayer(socket) {
  const r = roomOf(socket);
  if (!r) return;
  const p = r.players.get(socket.id);
  socket.leave(r.code);
  socket.data.room = null;
  if (!p) return;
  r.players.delete(socket.id);
  r.order = r.order.filter(id => id !== socket.id);
  io.to(r.code).emit('sys', { text: `${p.name} خرج من الغرفة` });
  if (!r.players.size) {
    clearTurnTimers(r); clearTimeout(r.starting); clearInterval(r.autoTimer);
    rooms.delete(r.code);
    return;
  }
  if (r.hostId === socket.id) r.hostId = r.players.keys().next().value;
  if (r.state === 'game') {
    if (r.players.size < 2) { endGame(r); return; }
    if (r.drawerId === socket.id) {
      if (r.phase === 'play') endTurn(r);
      else if (r.phase === 'choose') { clearTurnTimers(r); r.turn++; nextTurn(r); }
    } else if (r.phase === 'play') {
      const need = [...r.players.keys()].filter(id => id !== r.drawerId);
      if (need.length && need.every(id => r.guessed.has(id))) endTurn(r);
    }
  }
  emitRoom(r);
  syncAuto(r);
}


let hubRoom = newRoom(!!opts.isPublic);
rooms.delete(hubRoom.code); hubRoom.code = opts.code; rooms.set(hubRoom.code, hubRoom);

function wire(socket){
  clients.set(socket.id, socket);
  socket.on('join', (d, cb) => {
    cb = typeof cb === 'function' ? cb : () => {};
    d = d || {};
    const name = String(d.name || '').trim().slice(0, 14);
    if (!name) return cb({ ok: false, error: 'اكتب اسمك أول' });
    const a = { c: clampN(d.a && d.a.c, 0, 7, 0) | 0, f: clampN(d.a && d.a.f, 0, 5, 0) | 0 };
    const r = hubRoom;
    if (r.state !== 'lobby') return cb({ ok: false, busy: true, error: 'اللعبة شغالة بهالغرفة، جرّب بعد ما تخلص' });
    if (r.starting) return cb({ ok: false, busy: true, error: 'اللعبة عم تبدأ هلأ' });
    if (r.players.size >= (r.public ? 6 : MAX_PLAYERS)) return cb({ ok: false, busy: true, error: 'الغرفة ممتلئة' });
    r.players.set(socket.id, { id: socket.id, name, a, score: 0, voice: false, muted: false });
    if (!r.hostId || !r.players.has(r.hostId)) r.hostId = socket.id;
    socket.data.room = r.code;
    cb({ ok: true, id: socket.id, code: r.code });
    io.to(r.code).emit('sys', { text: `${name} دخل الغرفة` });
    emitRoom(r);
    syncAuto(r);
  });
  socket.on('cfg', c => {
    const r = roomOf(socket);
    if (!r || r.public || r.hostId !== socket.id || r.state !== 'lobby') return;
    c = c || {};
    if ([1, 2, 3].includes(+c.rounds)) r.cfg.rounds = +c.rounds;
    if ([30, 45, 60, 80].includes(+c.time)) r.cfg.time = +c.time;
    emitRoom(r);
  });
  socket.on('start', () => {
    const r = roomOf(socket);
    if (!r || r.public || r.hostId !== socket.id) return;
    beginCountdown(r);
  });
  socket.on('pick', w => {
    const r = roomOf(socket);
    if (!r || r.phase !== 'choose' || r.drawerId !== socket.id || !r.choices.includes(w)) return;
    beginPlay(r, w);
  });

  /* رسم */
  const canDraw = r => r && r.state === 'game' && r.phase === 'play' && r.drawerId === socket.id;
  const pt = p => Array.isArray(p) && p.length === 2 ? [clampN(p[0], 0, 800, 0), clampN(p[1], 0, 600, 0)] : null;
  socket.on('d:start', d => {
    const r = roomOf(socket); if (!canDraw(r) || !d) return;
    const p = pt(d.p); if (!p) return;
    const s = { c: String(d.c).slice(0, 9), s: clampN(d.s, 1, 60, 8), pts: [p] };
    r.strokes.push(s);
    socket.to(r.code).emit('d:start', { c: s.c, s: s.s, p });
  });
  socket.on('d:pts', d => {
    const r = roomOf(socket); if (!canDraw(r) || !d || !Array.isArray(d.p) || !r.strokes.length) return;
    const pts = d.p.slice(0, 200).map(pt).filter(Boolean);
    r.strokes[r.strokes.length - 1].pts.push(...pts);
    socket.to(r.code).emit('d:pts', { p: pts });
  });
  socket.on('d:undo', () => { const r = roomOf(socket); if (!canDraw(r)) return; r.strokes.pop(); socket.to(r.code).emit('d:undo'); });
  socket.on('d:clear', () => { const r = roomOf(socket); if (!canDraw(r)) return; r.strokes = []; socket.to(r.code).emit('d:clear'); });

  /* تخمين ودردشة */
  socket.on('guess', t => {
    const r = roomOf(socket); const p = r && r.players.get(socket.id);
    if (!p) return;
    const text = String(t || '').trim().slice(0, 60);
    if (!text) return;
    const playing = r.state === 'game' && r.phase === 'play';
    if (playing) {
      const knows = socket.id === r.drawerId || r.guessed.has(socket.id);
      if (!knows) {
        if (core(text) === core(r.word)) {
          const left = Math.max(0, r.endAt - Date.now()) / (r.cfg.time * 1000);
          const pts = Math.round(60 + 140 * left);
          p.score += pts;
          const d = r.players.get(r.drawerId); if (d) d.score += 40;
          r.delta[p.id] = (r.delta[p.id] || 0) + pts;
          r.delta[r.drawerId] = (r.delta[r.drawerId] || 0) + 40;
          r.guessed.add(p.id);
          io.to(r.code).emit('correct', { id: p.id, pts, scores: scoresOf(r) });
          socket.emit('turn:word', { word: r.word });
          const need = [...r.players.keys()].filter(id => id !== r.drawerId);
          if (need.every(id => r.guessed.has(id))) setTimeout(() => { if (r.phase === 'play') endTurn(r); }, 700);
          return;
        }
        if (core(r.word).length > 3 && lev(core(text), core(r.word)) <= 1) socket.emit('near');
      } else if (core(text).includes(core(r.word))) return; // ما نسرّب الكلمة
    }
    io.to(r.code).emit('chat', { id: p.id, name: p.name, text });
  });

  /* صوت (إشارات WebRTC فقط، الصوت نفسه بيمر مباشرة بين اللاعبين) */
  socket.on('voice', (d, cb) => {
    const r = roomOf(socket); const p = r && r.players.get(socket.id);
    if (!p) return;
    const on = !!(d && d.on);
    p.voice = on; p.muted = false;
    if (typeof cb === 'function') cb(on ? [...r.players.values()].filter(x => x.voice && x.id !== socket.id).map(x => x.id) : []);
    emitRoom(r);
  });
  socket.on('vmute', m => {
    const r = roomOf(socket); const p = r && r.players.get(socket.id);
    if (!p || !p.voice) return;
    p.muted = !!m; emitRoom(r);
  });

  socket.on('leave', () => removePlayer(socket));
}

const localSock = mkSock(opts.hostId, (ev, d) => setTimeout(() => opts.deliver(ev, d), 0));
wire(localSock);

const socks = new Map();
return {
  fromLocal(ev, d, cb){ const h = localSock.handlers[ev]; if (h) h(d, cb); },
  attach(pid, send){ const s = mkSock(pid, send); socks.set(pid, s); wire(s); return s; },
  has(pid){ return socks.has(pid); },
  receive(pid, e, d, ack){ const s = socks.get(pid); if (!s || typeof e !== 'string') return; const h = s.handlers[e]; if (h) h(d, ack); },
  detach(pid){ const s = socks.get(pid); if (!s) return; try { removePlayer(s); } catch (e) {} clients.delete(pid); socks.delete(pid); },
  info(){ return { state: hubRoom.state, count: hubRoom.players.size, cap: hubRoom.public ? 6 : MAX_PLAYERS }; },
  destroy(){ clearTurnTimers(hubRoom); clearTimeout(hubRoom.starting); clearInterval(hubRoom.autoTimer); rooms.clear(); }
};
}

const r1=p=>[Math.round(p[0]*10)/10,Math.round(p[1]*10)/10];
class Board{
  constructor(cv){this.cv=cv;this.ctx=cv.getContext('2d');cv.width=1200;cv.height=900;this.strokes=[];this.cur=null;this.enabled=false;this.color='#1A1D4A';this.size=8;this.erase=false;this.anim=0;this.net=null;
    const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*800,(e.clientY-r.top)/r.height*600]};
    cv.addEventListener('pointerdown',e=>{if(!this.enabled)return;cv.setPointerCapture(e.pointerId);const p=pos(e);this.cur={c:this.erase?'#FFFFFF':this.color,s:this.erase?this.size*2.4:this.size,pts:[p]};this.strokes.push(this.cur);this.net&&this.net.start(this.cur.c,this.cur.s,p);this.redraw()});
    cv.addEventListener('pointermove',e=>{if(!this.cur)return;const p=pos(e);this.cur.pts.push(p);this.net&&this.net.pts(p);this.redraw()});
    const end=()=>{if(this.cur){this.cur=null;this.net&&this.net.end()}};
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
    this.redraw();
  }
  redraw(){const c=this.ctx;c.setTransform(1.5,0,0,1.5,0,0);c.fillStyle='#FFFFFF';c.fillRect(0,0,800,600);c.lineCap='round';c.lineJoin='round';
    for(const s of this.strokes){c.strokeStyle=c.fillStyle=s.c;c.lineWidth=s.s;if(s.pts.length===1){c.beginPath();c.arc(s.pts[0][0],s.pts[0][1],s.s/2,0,6.3);c.fill()}else{c.beginPath();c.moveTo(...s.pts[0]);for(const p of s.pts)c.lineTo(...p);c.stroke()}}}
  clear(){this.anim++;this.strokes=[];this.cur=null;this.redraw()}
  stop(){this.anim++}
  remoteStart(d){this.strokes.push({c:d.c,s:d.s,pts:[d.p]});this.redraw()}
  remotePts(d){const s=this.strokes[this.strokes.length-1];if(!s)return;s.pts.push(...d.p);this.redraw()}
  play(strokes,ms){const D=strokes.map(s=>({...s,pts:dens(s.pts)}));const total=D.reduce((a,s)=>a+s.pts.length,0);const id=++this.anim;const t0=performance.now();
    return new Promise(res=>{const f=now=>{if(id!==this.anim)return res(false);const p=Math.min(1,(now-t0)/ms);let n=Math.floor(total*p);const out=[];for(const s of D){if(n<=0)break;out.push({...s,pts:s.pts.slice(0,Math.min(n,s.pts.length))});n-=s.pts.length}this.strokes=out;this.redraw();p<1?requestAnimationFrame(f):res(true)};requestAnimationFrame(f)})}
}

/* ---------- الشبكة: Firebase Realtime Database ---------- */
const FB=window.KH_FIREBASE||{};
let db=null,tsOffset=0;
function initDb(){
  if(db)return db;
  if(typeof firebase==='undefined')throw new Error('ما انحمّلت مكتبة Firebase. تأكد من الإنترنت');
  try{
    if(!firebase.apps.length)firebase.initializeApp(FB);
    db=firebase.database();
  }catch(e){throw new Error('رابط قاعدة البيانات (databaseURL) غلط. انسخه من صفحة Realtime Database')}
  db.ref('.info/serverTimeOffset').on('value',s=>{tsOffset=s.val()||0});
  return db;
}
function dbReady(ms){
  initDb();
  return new Promise((res,rej)=>{
    const ref=R('.info/connected');
    const fn=s=>{if(s.val()===true){clearTimeout(t);ref.off('value',fn);res()}};
    const t=setTimeout(()=>{ref.off('value',fn);rej(new Error('ما قدرنا نوصل لقاعدة Firebase. تأكد إنك فعّلت Realtime Database وإن الرابط صح'))},ms||9000);
    ref.on('value',fn);
  });
}
const nowTs=()=>Date.now()+tsOffset;
const DB_HELP='ما قدرنا نوصل لقاعدة البيانات. تأكد إنك فعّلت Realtime Database وإن رابطها (databaseURL) صح';
const T=(p,ms=10000)=>Promise.race([Promise.resolve(p),new Promise((_,rej)=>setTimeout(()=>rej(new Error(DB_HELP)),ms))]);
let dbOn=null;
function watchConn(){
  const st=$('#dbStatus');
  const set=(t,ok)=>{if(!st)return;st.textContent=t;st.style.color=ok===true?'var(--teal)':ok===false?'var(--coral)':'var(--muted)'};
  try{initDb()}catch(e){set(e.message,false);return}
  set('عم نتصل بقاعدة البيانات…');
  db.ref('.info/connected').on('value',s=>{dbOn=!!s.val();set(dbOn?'متصل بقاعدة البيانات ✓':'غير متصل بقاعدة البيانات',dbOn)});
  st&&(st.style.whiteSpace='pre-line',st.style.wordBreak='break-all');
  setTimeout(()=>{if(dbOn!==true)diagnose(set)},8000);
}
async function diagnose(set){
  const base=String(FB.databaseURL||'').replace(/\/$/,'');
  let msg,restOk=false;
  try{
    const r=await fetch(base+'/rooms.json?shallow=true',{cache:'no-store'});
    if(r.ok){restOk=true;msg='القاعدة موجودة وبتستجيب، بس الاتصال الفوري ما اشتغل بعد'}
    else if(r.status===401||r.status===403)msg='القواعد (Rules) مانعة القراءة. الصق القواعد واضغط Publish';
    else if(r.status===404||r.status===400)msg='الرابط غلط أو ما في قاعدة على هالرابط';
    else msg='رد غير متوقع من القاعدة، رقمه '+r.status;
  }catch(e){msg='ما قدرنا نوصل للرابط من شبكتك أو متصفحك. ممكن شبكة أو حاجب إعلانات بيمنع Firebase. جرّب شبكة تانية (واي فاي أو داتا)'}
  if(restOk){
    try{firebase.database.INTERNAL.forceLongPolling();db.goOffline();db.goOnline()}catch(e){}
    await new Promise(r=>setTimeout(r,7000));
    if(dbOn===true)return;
  }
  set('غير متصل بقاعدة البيانات.\n'+msg+'\nالرابط المستعمل: '+base,false);
}
async function ensureConnected(){
  initDb();
  if(dbOn===true)return;
  await new Promise((res,rej)=>{
    let n=0;const t=setInterval(()=>{if(dbOn===true){clearInterval(t);res()}else if(++n>=40){clearInterval(t);rej(new Error(DB_HELP))}},200);
  });
}

const fresh=(hb,ms=30000)=>!!hb&&nowTs()-hb<ms;
const clean=d=>d===undefined?null:JSON.parse(JSON.stringify(d));
const newId=()=>'p'+Math.random().toString(36).slice(2,10);
const R=p=>db.ref(p);
const Net={role:null,code:null,id:null,pub:false,hub:null,ack:new Map(),ackN:0,handlers:{},offs:[],hbT:null,bt:null,joined:false,lostFired:false};
const socket={
  on(ev,fn){(Net.handlers[ev]=Net.handlers[ev]||[]).push(fn)},
  emit(ev,...a){
    const cb=typeof a[a.length-1]==='function'?a.pop():null,d=a[0];
    if(Net.role==='host')Net.hub.fromLocal(ev,d,cb);
    else if(Net.role==='guest'){let id=0;if(cb){id=++Net.ackN;Net.ack.set(id,cb)}R(`rooms/${Net.code}/in`).push({f:Net.id,e:ev,d:clean(d),a:id})}
  }
};
const dispatch=(ev,d)=>(Net.handlers[ev]||[]).forEach(f=>f(d));
function fix(e,d){
  if(!d)return d;
  if(e==='turn:end')d.delta=d.delta||{};
  if(e==='room')d.players=d.players||[];
  if(e==='game:end')d.ranking=d.ranking||[];
  return d;
}
function onWire(m){if(!m)return;if(m.ack){const f=Net.ack.get(m.ack);Net.ack.delete(m.ack);f&&f(m.d||null)}else dispatch(m.e,fix(m.e,m.d))}
function listen(ref,evt,fn){ref.on(evt,fn);Net.offs.push(()=>ref.off(evt,fn))}

/* بث نبض الغرفة (بيعرّف اللاعبين إنها شغالة) */
function beat(){
  if(Net.role!=='host'||!Net.hub)return;
  const i=Net.hub.info(),m={hostId:Net.id,public:Net.pub,hb:nowTs(),state:i.state,count:i.count,cap:i.cap};
  R(`rooms/${Net.code}/meta`).update(m);
  if(Net.pub)R(`publicRooms/${Net.code}`).update({hb:m.hb,state:m.state,count:m.count,cap:m.cap});
}
async function startHost(code,isPub){
  initDb();
  const tr=await T(R(`rooms/${code}/meta`).transaction(cur=>(cur&&fresh(cur.hb,60000))?undefined:{hostId:'x',public:isPub,hb:nowTs(),state:'lobby',count:0,cap:6}));
  if(!tr.committed)return null;
  await T(Promise.all(['in','out','presence','rtc'].map(k=>R(`rooms/${code}/${k}`).remove())));
  Net.role='host';Net.code=code;Net.id=newId();Net.pub=isPub;ST.id=Net.id;
  const out=(pid,m)=>R(`rooms/${code}/out/${pid}`).push(m);
  Net.hub=createHub({code,isPublic:isPub,hostId:Net.id,deliver:dispatch,onChange:()=>{clearTimeout(Net.bt);Net.bt=setTimeout(beat,250)}});
  listen(R(`rooms/${code}/in`),'child_added',snap=>{
    const m=snap.val();snap.ref.remove();
    if(!m||!m.f||typeof m.e!=='string')return;
    const pid=m.f;
    if(!Net.hub||!Net.hub.has(pid)){if(m.e!=='join'||!Net.hub)return;Net.hub.attach(pid,(ev,d)=>out(pid,{e:ev,d:clean(d)}))}
    Net.hub.receive(pid,m.e,m.d,m.a?res=>out(pid,{ack:m.a,d:clean(res)}):undefined);
  });
  listen(R(`rooms/${code}/presence`),'child_removed',snap=>{Net.hub&&Net.hub.detach(snap.key)});
  beat();Net.hbT=setInterval(beat,4000);
  return new Promise(res=>socket.emit('join',{mode:'create',name:me.name,a:me.a},res));
}
function sendAck(ev,d,ms){
  return new Promise((resolve,reject)=>{
    const id=++Net.ackN;
    const ref=R(`rooms/${Net.code}/in`).push({f:Net.id,e:ev,d:clean(d),a:id});
    const t=setTimeout(()=>{Net.ack.delete(id);ref.remove();reject(new Error('timeout'))},ms);
    Net.ack.set(id,res=>{clearTimeout(t);resolve(res)});
  });
}
async function guestJoin(code,mode,ms){
  initDb();
  Net.role='guest';Net.code=code;Net.id=newId();Net.joined=false;Net.lostFired=false;ST.id=Net.id;
  const pres=R(`rooms/${code}/presence/${Net.id}`);
  await T(pres.set(true));pres.onDisconnect().remove();
  listen(R(`rooms/${code}/out/${Net.id}`),'child_added',snap=>{const m=snap.val();snap.ref.remove();onWire(m)});
  let res;
  try{res=await sendAck('join',{mode,code,name:me.name,a:me.a},ms)}
  catch(e){guestCleanup();throw new Error(e.message==='timeout'?'صاحب الغرفة ما رد. تأكد إنه فاتح الصفحة':e.message)}
  if(!res||!res.ok){guestCleanup();throw new Error((res&&res.error)||'ما قدرنا ندخل')}
  Net.joined=true;
  listen(R(`rooms/${code}/meta`),'value',s=>{if(Net.role==='guest'&&Net.joined&&s.val()===null)onLost()});
  return res;
}
function guestCleanup(){
  Net.offs.splice(0).forEach(f=>{try{f()}catch(e){}});
  if(Net.role==='guest'&&Net.code&&Net.id){try{const p=R(`rooms/${Net.code}/presence/${Net.id}`);p.onDisconnect().cancel();p.remove()}catch(e){}}
  Net.role=null;Net.code=null;Net.id=null;Net.ack.clear();
}
function teardown(){
  clearInterval(Net.hbT);clearTimeout(Net.bt);Net.hbT=null;
  stopRtc();
  if(Net.role==='host'){
    const code=Net.code,pub=Net.pub;
    Net.offs.splice(0).forEach(f=>{try{f()}catch(e){}});
    try{Net.hub.destroy()}catch(e){}
    try{R(`rooms/${code}`).remove();if(pub)R(`publicRooms/${code}`).remove()}catch(e){}
    Net.role=null;Net.code=null;Net.id=null;Net.hub=null;Net.ack.clear();
  }else if(Net.role==='guest')guestCleanup();
  Net.joined=false;
}
function onLost(){
  if(Net.lostFired)return;Net.lostFired=true;
  voiceLeave(true);teardown();ST.room=null;clearInterval(ST.tick);ov('');$('#cd').hidden=true;
  toast('صاحب الغرفة طلع، انتهت الغرفة');go('home');
}

const makeCode=()=>Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(rnd(0,31))]).join('');
async function findRandom(depth){
  initDb();toast('عم ندوّر على غرفة…',0);
  const list=(await T(R('publicRooms').once('value'))).val()||{};
  const cands=Object.entries(list).filter(([c,r])=>fresh(r.hb,20000)&&r.state==='lobby'&&r.count<r.cap).sort((a,b)=>b[1].count-a[1].count);
  for(const [c] of cands){try{const r=await guestJoin(c,'random',8000);if(r&&r.ok)return r}catch(e){}}
  let res=null,code='';
  for(let t=0;t<6&&!res;t++){code='PUB'+makeCode();res=await startHost(code,true)}
  if(!res)return null;
  await sleep(3500);
  if(Net.role==='host'&&Net.hub&&Net.hub.info().count===1&&(depth||0)<1){
    const l2=(await T(R('publicRooms').once('value'))).val()||{};
    const other=Object.entries(l2).filter(([c,r])=>c!==code&&(r.count>1||c<code)&&fresh(r.hb,20000)&&r.state==='lobby'&&r.count<r.cap).sort((a,b)=>b[1].count-a[1].count||(a[0]<b[0]?-1:1))[0];
    if(other){teardown();try{const r=await guestJoin(other[0],'random',8000);if(r&&r.ok)return r}catch(e){}return findRandom((depth||0)+1)}
  }
  return res;
}
async function joinByCode(code){
  initDb();

  if(!meta)throw new Error('ما لقينا غرفة بهالكود');
  const ok=fresh(meta.hb,25000);
  if(!ok)toast('صاحب الغرفة مش فاتح الصفحة هلأ، عم نستنى…',0);
  return guestJoin(code,'join',ok?12000:45000);
}
let joining=false;
async function join(mode,code){
  if(joining||!needName())return;
  joining=true;teardown();toast('جاري الاتصال…',0);

    else if(mode==='join')res=await joinByCode(code);
    else res=await findRandom(0);
    if(!res||!res.ok)throw new Error((res&&res.error)||'ما قدرنا نبدأ، جرّب مرة ثانية');
    ST.id=res.id;ST.phase='idle';$('#lobbyNote').hidden=true;$('#toast').hidden=true;go('lobby');renderLobby();
  }catch(e){
    teardown();toast(prettyErr(e),7000);
  }finally{joining=false;btns.forEach(b=>b.disabled=false)}
}
watchConn();

const ST={id:null,room:null,drawerId:null,phase:'idle',word:'',len:0,hintCh:{},total:45,endAt:0,tick:null,guessed:new Set(),turns:0,turn:0,iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
if(window.KH_ICE)ST.iceServers=window.KH_ICE;
const players=()=>ST.room?ST.room.players:[];
const pById=id=>players().find(p=>p.id===id);
const iAmDrawer=()=>ST.drawerId===ST.id;

/* ---------- helpers ---------- */
let toastT;
function toast(t,ms=2600){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);if(ms>0)toastT=setTimeout(()=>el.hidden=true,ms)}
let screen='home',demoRun=0;
function go(name){
  screen=name;
  $$('.screen').forEach(s=>s.hidden=s.id!=='s-'+name);
  $('#roomTools').hidden=name==='home';
  const s=$('#s-'+name);s.style.animation='none';void s.offsetWidth;s.style.animation='';
  name==='home'?demoLoop():demoRun++;
  window.scrollTo(0,0);
}
const hintBoxes=(len,ch)=>Array.from({length:len},(_,i)=>{const c=ch(i);return `<span class="lt${c?' on':''}">${c?esc(c):''}</span>`}).join('');
const micIcon=m=>`<svg class="mi${m?' m':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" role="img" aria-label="${m?'مايك مطفي':'مايك شغال'}"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>${m?'<path d="M4 4l16 16"/>':''}</svg>`;

/* ---------- me ---------- */
const me={name:store.get('kh-name')||'',a:randAv()};
try{const a=JSON.parse(store.get('kh-av')||'null');if(a&&typeof a.c==='number')me.a=a}catch(e){}
$('#name').value=me.name;
const paintMe=()=>{$('#shuffle').innerHTML=av(me.a)};paintMe();
$('#shuffle').onclick=()=>{me.a=randAv();paintMe();store.set('kh-av',JSON.stringify(me.a));const b=$('#shuffle');b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin')};
function needName(){const v=$('#name').value.trim();if(!v){const i=$('#name');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');i.focus();toast('اكتب اسمك أول');return false}me.name=v;store.set('kh-name',v);return true}

/* ---------- home demo ---------- */
async function demoLoop(){
  const run=++demoRun;let i=Math.floor(rnd(0,DRAWABLE.length));
  while(run===demoRun){
    const w=DRAWABLE[i++%DRAWABLE.length],who={name:pick(NAMES),a:randAv()},chars=[...w];
    $('#demoAv').innerHTML=av(who.a);$('#demoWho').textContent=who.name+' يرسم';
    demo.clear();let shown=-1;const paint=full=>{$('#demoHint').innerHTML=hintBoxes(chars.length,k=>full||k===shown?chars[k]:'')};paint(false);
    setTimeout(()=>{if(run===demoRun){shown=0;paint(false)}},2300);
    const ok=await demo.play(ART[w](),reduced?300:4300);
    if(!ok||run!==demoRun)return;
    paint(true);await sleep(2000);
  }
}

/* ---------- joining ---------- */
$('#joinForm').onsubmit=e=>{e.preventDefault();join('random')};
$('#btnCreate').onclick=()=>join('create');
$('#btnJoin').onclick=()=>{const c=$('#code').value.trim().toUpperCase();if(c.length!==4){toast('الكود 4 حروف أو أرقام');$('#code').focus();return}join('join',c)};
$('#copyCode').onclick=async()=>{const t=$('#roomCode').textContent;try{await navigator.clipboard.writeText(t);toast('اننسخ الكود: '+t)}catch(e){toast('الكود: '+t)}};

/* ---------- lobby ---------- */
const slotHTML=(p,host)=>p?`<div class="slot"><div class="face in" data-pid="${p.id}">${host?crown:''}${av(p.a)}${p.voice?`<span class="vi">${micIcon(p.muted)}</span>`:''}</div><b>${esc(p.name)}${p.id===ST.id?' (إنت)':''}</b></div>`:`<div class="slot"><div class="face empty">؟</div><b class="muted">&nbsp;</b></div>`;
function chips(el,vals,key,fmt,enabled){

  el.innerHTML=vals.map(v=>`<button class="chip" type="button" data-v="${v}" aria-pressed="${cfg[key]===v}"${enabled?'':' disabled'}>${fmt(v)}</button>`).join('');

/* ---------- game ---------- */
const COLORS=['#1A1D4A','#FF4F73','#FF8A3D','#FFC22E','#7ED957','#10B59D','#2BB7FF','#4157FF','#A56BFF','#8B5A2B'];
const SIZES=[5,10,18];
(()=>{
  $('#swatches').innerHTML=COLORS.map((c,i)=>`<button class="sw" type="button" style="background:${c}" data-c="${c}" aria-label="لون ${i+1}" aria-pressed="${i===0}"></button>`).join('');
  $('#sizes').innerHTML=SIZES.map((s,i)=>`<button class="sz" type="button" data-s="${s}" aria-label="سماكة ${i+1}" aria-pressed="${i===1}"><i style="width:${s+3}px;height:${s+3}px"></i></button>`).join('');
  $$('.sw').forEach(b=>b.onclick=()=>{board.color=b.dataset.c;board.erase=false;$('#toolErase').setAttribute('aria-pressed','false');$$('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $$('.sz').forEach(b=>b.onclick=()=>{board.size=+b.dataset.s;$$('.sz').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#toolErase').onclick=e=>{board.erase=!board.erase;e.currentTarget.setAttribute('aria-pressed',board.erase);$$('.sw').forEach(x=>x.setAttribute('aria-pressed',!board.erase&&x.dataset.c===board.color))};
  $('#toolUndo').onclick=()=>{if(!board.enabled)return;board.strokes.pop();board.redraw();socket.emit('d:undo')};
  $('#toolClear').onclick=()=>{if(!board.enabled)return;board.strokes=[];board.redraw();socket.emit('d:clear')};
  const net={buf:[],t:null,
    start(c,s,p){socket.emit('d:start',{c,s,p:r1(p)})},
    pts(p){this.buf.push(r1(p));if(!this.t)this.t=setTimeout(()=>this.flush(),40)},
    flush(){this.t=null;if(this.buf.length){socket.emit('d:pts',{p:this.buf});this.buf=[]}},
    end(){clearTimeout(this.t);this.flush()}};
  board.net=net;
})();
socket.on('d:start',d=>board.remoteStart(d));
socket.on('d:pts',d=>board.remotePts(d));
socket.on('d:undo',()=>{board.strokes.pop();board.redraw()});

function addMsg(kind,who,text){const c=$('#chat');const d=document.createElement('div');d.className='msg '+kind;d.innerHTML=(who?`<b>${esc(who)}</b> `:'')+esc(text);c.appendChild(d);c.scrollTop=c.scrollHeight}
function renderPlayers(){
  const arr=[...players()].sort((a,b)=>b.score-a.score);
  $('#gPlayers').innerHTML=arr.map((p,i)=>`<div class="pl${p.id===ST.drawerId?' draw':''}${ST.guessed.has(p.id)?' got':''}" data-id="${p.id}"><span class="rk">${i+1}</span><span class="a${V.speaking.has(p.id)?' speak':''}" data-pid="${p.id}">${av(p.a)}</span><div class="pn"><b>${esc(p.name)}${p.id===ST.id?' (إنت)':''}</b><small>${p.id===ST.drawerId?'يرسم الآن':ST.guessed.has(p.id)?'خمّن الكلمة':'&nbsp;'}</small></div>${p.voice?micIcon(p.muted):''}<span class="sc">${p.score}</span></div>`).join('');
}
function bump(id){const el=$(`.pl[data-id="${id}"] .sc`);if(el)el.classList.add('bump')}
function applyScores(m){m=m||{};players().forEach(p=>{if(m[p.id]!=null)p.score=m[p.id]})}
function setHint(){
  const known=ST.phase==='reveal'||iAmDrawer()||ST.guessed.has(ST.id);
  const chars=[...ST.word];
  $('#hint').innerHTML=ST.len?hintBoxes(ST.len,i=>known?chars[i]:ST.hintCh[i]):'';
  $('#hintCap').textContent=ST.phase==='play'?(iAmDrawer()?'ارسم هالكلمة':`الكلمة من ${ST.len} حروف`):'';
}
function ov(html){const o=$('#ov');o.innerHTML=html;o.hidden=!html}
function setRing(left){const f=Math.max(0,left/ST.total);$('#ringFg').style.strokeDashoffset=163.4*(1-f);$('#timeNum').textContent=Math.ceil(Math.max(0,left));$('#ring').classList.toggle('low',left<=10&&ST.phase==='play')}

socket.on('game:start',d=>{
  ST.total=d.time;ST.turns=d.turns;ST.guessed=new Set();ST.drawerId=null;ST.phase='idle';
  $('#chat').innerHTML='';addMsg('sys','','بدأت اللعبة، بالتوفيق للجميع');
  $('#cd').hidden=true;go('game');renderPlayers();
});
socket.on('turn:choose',d=>{
  ST.drawerId=d.drawerId;ST.phase='choose';ST.guessed=new Set();ST.word='';ST.len=0;ST.hintCh={};
  clearInterval(ST.tick);board.clear();board.enabled=false;
  $('#turnChip').textContent=`الدور ${d.turn} من ${d.turns}`;
  const mine=iAmDrawer(),dr=pById(d.drawerId)||{name:'؟',a:{c:0,f:0}};

  if(!mine){$('#spAv').innerHTML=av(dr.a);$('#spTxt').textContent=`${dr.name} هو الرسّام. خمّن شو عم يرسم`}
  $('#guess').disabled=mine;$('#guess').placeholder=mine?'إنت الرسّام هالدور':'اكتب تخمينك';
  addMsg('sys','',`${dr.name} بيرسم هالدور`);
  renderPlayers();setHint();setRing(ST.total);
  ov(mine?`<h2>جاري تجهيز الكلمات</h2>`:`<div style="width:84px;height:84px;animation:pulse 1s infinite">${av(dr.a)}</div><h2>${esc(dr.name)} عم يختار كلمة</h2>`);
});
socket.on('turn:words',d=>{
  ov(`<h2>اختر كلمة وارسمها</h2><div class="choices">${d.words.map(w=>`<button class="btn" type="button" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`);
  $$('#ov [data-w]').forEach(b=>b.onclick=()=>{socket.emit('pick',b.dataset.w);ov(`<h2>يلا ارسم</h2>`)});
});
socket.on('turn:begin',d=>{
  ST.phase='play';ST.len=d.len;ST.total=d.ms/1000;ST.endAt=performance.now()+d.ms;ST.hintCh={};
  ov('');board.enabled=iAmDrawer();setHint();renderPlayers();
  clearInterval(ST.tick);ST.tick=setInterval(()=>setRing((ST.endAt-performance.now())/1000),100);
  if(!iAmDrawer())$('#guess').focus({preventScroll:true});
});
socket.on('turn:word',d=>{ST.word=d.word;setHint()});

  addMsg('ok','',d.id===ST.id?`خمّنت الكلمة! +${d.pts}`:`${p?p.name:'؟'} خمّن الكلمة! +${d.pts}`);

  if(d.id===ST.id){$('#guess').placeholder='خمّنتها! استنى الباقي'}

socket.on('sys',d=>addMsg('sys','',d.text));
socket.on('turn:end',d=>{
  clearInterval(ST.tick);ST.phase='reveal';ST.word=d.word;board.enabled=false;applyScores(d.scores);
  setHint();setRing(0);renderPlayers();
  const rows=players().filter(p=>d.delta[p.id]).map(p=>`<span><span style="width:28px;height:28px;display:inline-block">${av(p.a)}</span>${esc(p.name)} <i>+${d.delta[p.id]}</i></span>`).join('');
  ov(`<div class="muted" style="font-weight:800">الكلمة كانت</div><div class="big">${esc(d.word)}</div>${rows?`<div class="deltas">${rows}</div>`:'<div class="muted" style="font-weight:800">ما حدا خمّنها هالمرة</div>'}`);

$('#guessForm').onsubmit=e=>{e.preventDefault();const t=$('#guess').value.trim();$('#guess').value='';if(t)socket.emit('guess',t)};

/* ---------- final ---------- */
socket.on('game:end',d=>{
  clearInterval(ST.tick);ST.phase='idle';board.enabled=false;ov('');$('#cd').hidden=true;
  const r=d.ranking;if(!r.length)return;
  go('final');
  $('#winTitle').textContent=r[0].id===ST.id?'مبروك، إنت الفائز!':`الفائز: ${r[0].name}`;
  const order=r.length>=3?[1,0,2]:r.length===2?[1,0]:[0];
  const hs=[100,76,56],cols=['var(--sun)','var(--blue)','var(--coral)'];
  $('#podium').innerHTML=order.map((k,i)=>{const p=r[k];return `<div class="pcol"><div class="face" style="animation-delay:${.7+i*.12}s">${k===0?crown:''}${av(p.a)}</div><b>${esc(p.name)}${p.id===ST.id?' (إنت)':''}</b><div class="step" style="height:${hs[k]*2.2}px;background:${cols[k]};color:var(--on-accent);animation-delay:${i*.12}s"><span>${k+1}</span><small>${p.score} نقطة</small></div></div>`}).join('');
  $('#rest').innerHTML=r.slice(3).map((p,i)=>`<span><span class="av-s">${av(p.a)}</span>${i+4}. ${esc(p.name)} ${p.score}</span>`).join('');
  const cf=$('#confetti');cf.innerHTML='';
  if(!reduced)for(let i=0;i<44;i++){const s=document.createElement('i');s.style.cssText=`left:${rnd(0,100)}%;background:${pick(BG)};animation-duration:${rnd(2.6,4.6)}s;animation-delay:${rnd(0,1.2)}s`;cf.appendChild(s)}
});
$('#backRoom').onclick=()=>{if(!ST.room){go('home');return}go('lobby');renderLobby()};

/* ---------- voice (WebRTC mesh, signalling over socket.io) ---------- */
const V={on:false,muted:false,deaf:false,stream:null,ctx:null,pcs:new Map(),audios:new Map(),an:new Map(),speaking:new Set(),loop:null};
function setSpeaking(id,on){
  if(on===V.speaking.has(id))return;
  on?V.speaking.add(id):V.speaking.delete(id);
  $$(`[data-pid="${id}"]`).forEach(el=>el.classList.toggle('speak',on));
}
function watch(id,stream){
  try{
    if(!V.ctx)V.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=V.ctx.createMediaStreamSource(stream),an=V.ctx.createAnalyser();an.fftSize=512;src.connect(an);
    V.an.set(id,{an,buf:new Uint8Array(an.fftSize),hits:0});
  }catch(e){}
}
function startLoop(){
  if(V.loop)return;
  V.loop=setInterval(()=>{
    V.an.forEach((o,id)=>{
      o.an.getByteTimeDomainData(o.buf);let s=0;for(const v of o.buf){const d=(v-128)/128;s+=d*d}
      const rms=Math.sqrt(s/o.buf.length);o.hits=rms>.035?Math.min(o.hits+1,6):0;
      setSpeaking(id,o.hits>=2&&!(id===ST.id&&V.muted));
    });
  },120);
}
function pcFor(id){
  if(V.pcs.has(id))return V.pcs.get(id);
  const pc=new RTCPeerConnection({iceServers:ST.iceServers});pc._q=[];
  V.stream.getTracks().forEach(t=>pc.addTrack(t,V.stream));
  pc.onicecandidate=e=>{if(e.candidate)signal(id,{c:e.candidate.toJSON()})};
  pc.ontrack=e=>{
    const stream=e.streams[0];if(!stream||V.audios.has(id))return;
    const a=document.createElement('audio');a.autoplay=true;a.playsInline=true;a.srcObject=stream;a.muted=V.deaf;
    $('#audios').appendChild(a);a.play().catch(()=>{});V.audios.set(id,a);watch(id,stream);
  };
  V.pcs.set(id,pc);return pc;
}
function closePeer(id){
  const pc=V.pcs.get(id);if(pc){pc.close();V.pcs.delete(id)}
  const a=V.audios.get(id);if(a){a.srcObject=null;a.remove();V.audios.delete(id)}
  V.an.delete(id);setSpeaking(id,false);
}
async function callPeer(id){
  const pc=pcFor(id);const o=await pc.createOffer();await pc.setLocalDescription(o);
  signal(id,{sdp:pc.localDescription});
}
async function onRtc({from,data}){
  if(!V.on||!data)return;
  try{
    const pc=pcFor(from);
    if(data.sdp){
      await pc.setRemoteDescription(data.sdp);
      for(const c of pc._q.splice(0))await pc.addIceCandidate(c).catch(()=>{});
      if(data.sdp.type==='offer'){const a=await pc.createAnswer();await pc.setLocalDescription(a);signal(from,{sdp:pc.localDescription})}
    }else if(data.c){
      if(pc.remoteDescription)await pc.addIceCandidate(data.c).catch(()=>{});else pc._q.push(data.c);
    }
  }catch(e){console.warn('rtc',e)}
}
function syncVoicePeers(){
  if(!V.on)return;
  const live=new Set(players().filter(p=>p.voice&&p.id!==ST.id).map(p=>p.id));
  [...V.pcs.keys()].forEach(id=>{if(!live.has(id))closePeer(id)});
}
async function voiceJoin(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('الصوت بيحتاج رابط https أو localhost');return}
  try{V.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){toast('ما قدرنا نفتح المايك. اسمح للمتصفح باستخدامه');return}
  V.on=true;V.muted=false;startRtc();
  if(!V.ctx)V.ctx=new (window.AudioContext||window.webkitAudioContext)();
  V.ctx.resume&&V.ctx.resume();
  watch(ST.id,V.stream);startLoop();
  socket.emit('voice',{on:true},peers=>{(peers||[]).forEach(id=>callPeer(id).catch(()=>{}))});
  syncVoiceUI();
}
function voiceLeave(quiet){
  if(!V.on)return;
  [...V.pcs.keys()].forEach(closePeer);stopRtc();
  V.stream&&V.stream.getTracks().forEach(t=>t.stop());V.stream=null;V.an.delete(ST.id);setSpeaking(ST.id,false);
  V.on=false;V.muted=false;
  if(!quiet)socket.emit('voice',{on:false});
  syncVoiceUI();
}
function syncVoiceUI(){
  const v=$('#voiceBtn'),m=$('#micBtn'),d=$('#deafBtn');
  v.textContent=V.on?'اطلع من الصوت':'انضم للصوت';v.setAttribute('aria-pressed',V.on);v.classList.toggle('live',V.on);
  m.hidden=d.hidden=!V.on;
  m.textContent=V.muted?'المايك مطفي':'المايك شغال';m.classList.toggle('off',V.muted);
  d.textContent=V.deaf?'السماعة مطفية':'السماعة شغالة';d.classList.toggle('off',V.deaf);
}
$('#voiceBtn').onclick=()=>V.on?voiceLeave():voiceJoin();
$('#micBtn').onclick=()=>{V.muted=!V.muted;V.stream&&V.stream.getAudioTracks().forEach(t=>t.enabled=!V.muted);socket.emit('vmute',V.muted);if(V.muted)setSpeaking(ST.id,false);syncVoiceUI()};
$('#deafBtn').onclick=()=>{V.deaf=!V.deaf;V.audios.forEach(a=>a.muted=V.deaf);syncVoiceUI()};

/* ---------- leave ---------- */
function leaveRoom(){
  voiceLeave(true);
  teardown();
  clearInterval(ST.tick);ST.room=null;ST.drawerId=null;ST.phase='idle';ST.guessed=new Set();
  board.stop();board.enabled=false;$('#cd').hidden=true;ov('');
  go('home');
}
$('#leave').onclick=leaveRoom;
$('#toHome').onclick=leaveRoom;
$('#homeBtn').onclick=()=>{if(screen!=='home')leaveRoom()};
go('home');
})();
